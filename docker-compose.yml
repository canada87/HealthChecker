version: '3.8'

services:
  backend:
    build: ./backend
    container_name: healthtracker-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/healthtracker.db
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: healthtracker-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
